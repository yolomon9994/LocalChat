version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  web: ^1.1.1
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^3.0.2
  sqflite: ^2.4.2
  path: ^1.9.1
dev_dependencies:
