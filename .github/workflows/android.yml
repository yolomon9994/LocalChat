name: Android checks and testing APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: localchat-android-testing-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
